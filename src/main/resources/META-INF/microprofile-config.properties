# Can be overridden with env vars KAFKA_BOOTSTRAP_SERVERS, KAFKA_TOPIC, KAFKA_APPLICATION_ID, KAFKA_STATE_DIR
kafka.bootstrap.servers=localhost:9094
kafka.topic=input-data
kafka.application.id=kafka-stream-provider-app
# Absolute path (baked in at build time via Maven resource filtering, since Liberty dev mode's
# working directory is NOT the project root) where the Kafka Streams state store (RocksDB
# files, checkpoints) is persisted. Kept inside the repo instead of the OS temp dir, which can
# be cleared at any time by the OS.
kafka.state.dir=${project.basedir}\\kafka-streams-state

