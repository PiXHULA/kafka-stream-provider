<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kafka Stream Provider</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #333; }
        h2 { margin-top: 2rem; }
        form { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        input[type="text"] { flex: 1; padding: 0.5rem; font-size: 1rem; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
        .status { margin-bottom: 1rem; font-size: 0.9rem; min-height: 1.2rem; }
        .status.error { color: red; }
        .status.success { color: green; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
        th { background-color: #f4f4f4; }
        .refresh { margin-left: 0.5rem; }
    </style>
</head>
<body>
    <h1>Kafka Stream Provider</h1>

    <form id="messageForm">
        <input type="text" id="messageInput" placeholder="Enter a message" required />
        <button type="submit">Submit Message</button>
    </form>
    <div id="messageStatus" class="status"></div>

    <h2>Messages <button id="refreshMessages" class="refresh" type="button">Refresh</button></h2>
    <table id="messageTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Message</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody id="messageBody"></tbody>
    </table>

    <h2>Members</h2>
    <form id="memberForm">
        <input type="text" id="memberUsernameInput" placeholder="Enter a username" required />
        <button type="submit">Add Member</button>
    </form>
    <div id="memberStatus" class="status"></div>

    <h2>Member List <button id="refreshMembers" class="refresh" type="button">Refresh</button></h2>
    <table id="memberTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Username</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody id="memberBody"></tbody>
    </table>

    <script>
        const messageApiUrl = './api/messages';
        const memberApiUrl = './api/members';

        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const messageStatus = document.getElementById('messageStatus');
        const messageBody = document.getElementById('messageBody');
        const refreshMessagesButton = document.getElementById('refreshMessages');

        const memberForm = document.getElementById('memberForm');
        const memberUsernameInput = document.getElementById('memberUsernameInput');
        const memberStatus = document.getElementById('memberStatus');
        const memberBody = document.getElementById('memberBody');
        const refreshMembersButton = document.getElementById('refreshMembers');

        async function loadMessages() {
            try {
                const response = await fetch(messageApiUrl, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) {
                    throw new Error('Failed to load messages: ' + response.status);
                }
                const items = await response.json();
                messageBody.innerHTML = '';
                items.forEach((item, index) => {
                    appendRow(messageBody, [
                        String(index + 1),
                        typeof item === 'string' ? item : (item.message ?? JSON.stringify(item)),
                        formatTimestamp(item.timestamp)
                    ]);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function loadMembers() {
            try {
                const response = await fetch(memberApiUrl, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) {
                    throw new Error('Failed to load members: ' + response.status);
                }
                const items = await response.json();
                memberBody.innerHTML = '';
                items.forEach((item, index) => {
                    appendRow(memberBody, [
                        String(index + 1),
                        item.username ?? '',
                        formatTimestamp(item.createdTimestamp)
                    ]);
                });
            } catch (err) {
                console.error(err);
            }
        }

        function appendRow(tableBody, values) {
            const row = document.createElement('tr');
            values.forEach((value) => {
                const td = document.createElement('td');
                td.textContent = value;
                row.appendChild(td);
            });
            tableBody.appendChild(row);
        }

        function formatTimestamp(timestamp) {
            if (timestamp === undefined || timestamp === null) {
                return '';
            }
            const date = new Date(Number(timestamp));
            if (Number.isNaN(date.getTime())) {
                return '';
            }
            return date.toLocaleString();
        }

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageStatus.textContent = '';
            messageStatus.className = 'status';

            const message = messageInput.value.trim();
            if (!message) {
                return;
            }
            try {
                const response = await fetch(messageApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || ('Request failed: ' + response.status));
                }
                messageStatus.textContent = 'Message submitted successfully.';
                messageStatus.className = 'status success';
                messageInput.value = '';
                await loadMessages();
            } catch (err) {
                messageStatus.textContent = 'Error: ' + err.message;
                messageStatus.className = 'status error';
            }
        });

        memberForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            memberStatus.textContent = '';
            memberStatus.className = 'status';

            const username = memberUsernameInput.value.trim();
            if (!username) {
                return;
            }
            try {
                const response = await fetch(memberApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || ('Request failed: ' + response.status));
                }
                memberStatus.textContent = 'Member submitted successfully.';
                memberStatus.className = 'status success';
                memberUsernameInput.value = '';
                await loadMembers();
            } catch (err) {
                memberStatus.textContent = 'Error: ' + err.message;
                memberStatus.className = 'status error';
            }
        });

        refreshMessagesButton.addEventListener('click', loadMessages);
        refreshMembersButton.addEventListener('click', loadMembers);

        loadMessages();
        loadMembers();
    </script>
</body>
</html>
